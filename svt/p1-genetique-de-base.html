        "L'ADN est organisé en chromosomes, eux-mêmes rassemblés dans le noyau : l'ensemble du matériel génétique d'un individu constitue son génome. Une portion d'ADN qui code une information précise (par exemple la structure d'une protéine) est appelée un gène."

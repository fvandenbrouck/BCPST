      options:["Elles touchent le sol en même temps : la durée de chute ne dépend que de h et de g, pas de la vitesse horizontale", "La bille la plus rapide (v₂), car elle avance plus vite", "La bille la plus lente (v₁)"], correct:0,
      hint:"Le mouvement vertical z(t)=−½gt² est indépendant du mouvement horizontal x(t)=v·t : seule la hauteur h détermine la durée de chute."},
    {id:'r5', type:'raisonnement', difficulty:2, notion:'u3', q:"À vitesse initiale fixée et sans frottement, pour quel angle de tir (parmi 30°, 45°, 60°) la portée horizontale sur un sol plat est-elle maximale ?",
      options:["45°", "30°", "60°"], correct:0,
      hint:"La portée horizontale d'un tir sans frottement est proportionnelle à sin(2α) ; elle est maximale quand 2α=90°."},
    {id:'r6', type:'raisonnement', difficulty:2, notion:'u4', q:"Dans un tube cathodique, des électrons traversent un champ électrique perpendiculaire à leur vitesse initiale, entre deux plaques. Quel est l'effet de ce champ sur leur trajectoire ?",
      options:["Il dévie les électrons selon une trajectoire parabolique, comme un projectile dans le champ de pesanteur", "Il accélère les électrons en ligne droite, sans les dévier", "Il n'a aucun effet sur leur trajectoire"], correct:0,
      hint:"Un champ perpendiculaire à la vitesse initiale produit une accélération perpendiculaire : c'est la configuration de la déviation, pas de l'accélération rectiligne."},
    {id:'r7', type:'raisonnement', difficulty:1, notion:'u4', q:"Dans un accélérateur linéaire, si l'on double la tension U appliquée entre les plaques (charge q et distance d inchangées), comment évolue l'énergie cinétique gagnée par la particule (ΔEc=qU) ?",
      options:["Elle double", "Elle reste inchangée", "Elle est divisée par deux"], correct:0,
      hint:"ΔEc=qU : à q fixé, ΔEc est directement proportionnelle à U."},
    {id:'r8', type:'raisonnement', difficulty:1, notion:'u5', q:"Une force reste perpendiculaire à la trajectoire du système sur lequel elle s'exerce, tout au long du mouvement. Que peut-on dire de son travail ?",
      options:["Il est nul à chaque instant : F et le déplacement sont perpendiculaires, leur produit scalaire est nul", "Il est toujours positif", "Il est toujours négatif"], correct:0,
      hint:"Le travail d'une force est proportionnel au cosinus de l'angle entre la force et le déplacement ; ce cosinus est nul à 90°."},
    {id:'r9', type:'raisonnement', difficulty:2, notion:'u5', q:"Un système part du repos et atteint une vitesse de norme v après avoir reçu un travail total W de la part de toutes les forces qui s'exercent sur lui. Comment W s'exprime-t-il en fonction de m et v ?",
      options:["W = ½mv² (le système part du repos, donc ΔEc = Ec finale)", "W = mv", "W = mgv"], correct:0,
      hint:"TEC : ΔEc = W. Ici Ec initiale = 0 (repos), donc ΔEc = ½mv² − 0."},
    {id:'r10', type:'raisonnement', difficulty:2, notion:'u6', q:"Un système en chute libre (sans frottement) voit son énergie potentielle de pesanteur diminuer de 200 J entre deux instants. Que peut-on dire de son énergie cinétique sur ce même intervalle, sachant que l'énergie mécanique se conserve ?",

      hint:"Em = Ec + Ep constante ⟹ ΔEc = −ΔEp."},
    {id:'r11', type:'raisonnement', difficulty:1, notion:'u6', q:"Un pendule oscille en subissant un frottement de l'air non négligeable. Que peut-on dire de son énergie mécanique au cours du temps ?",

    {id:'r12', type:'raisonnement', difficulty:2, notion:'u6', q:"Pour déterminer la vitesse d'un système en un point donné de sa trajectoire, dans un champ de force uniforme sans frottement, on peut utiliser soit le théorème de l'énergie cinétique, soit la conservation de l'énergie mécanique. Que peut-on dire de ces deux méthodes ici ?",

    {id:'a1', difficulty:1, notion:'u3', statement:"Un objet est lâché sans vitesse initiale d'une hauteur h = 20 m (g = 9,8 m·s⁻², frottement négligé). Calcule, via la conservation de l'énergie mécanique, sa vitesse à l'arrivée au sol, en m/s.",

    {id:'a2', difficulty:2, notion:'u3', statement:"Un objet est lancé horizontalement avec une vitesse v₀ = 15 m/s depuis une hauteur h = 45 m (g = 9,8 m·s⁻², frottement négligé). Calcule la portée horizontale D (distance parcourue avant de toucher le sol), en mètres.",

    {id:'a3', difficulty:2, notion:'u4', statement:"Un électron (charge |q| = 1,6×10⁻¹⁹ C, masse m = 9,1×10⁻³¹ kg), initialement au repos, est accéléré par une tension U = 1000 V dans un accélérateur linéaire. Calcule sa vitesse de sortie, en ×10⁶ m/s (donne le nombre qui précède ×10⁶ m/s).",

    {id:'a4', difficulty:1, notion:'u5', statement:"Un système de masse m = 2,0 kg, initialement au repos, reçoit un travail total W = 64 J de la part des forces qui s'exercent sur lui. Calcule sa vitesse finale, en m/s.",

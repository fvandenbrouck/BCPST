<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tests — Module RMN du proton</title>
<style>
  body{font-family:'IBM Plex Mono',ui-monospace,monospace; background:#161512; color:#eee; padding:20px; max-width:940px; margin:0 auto;}
  h1{font-size:20px;}
  .pass{color:#8FAA68;} .fail{color:#E06A50; font-weight:700;}
  .case{padding:4px 0; border-bottom:1px solid #2a2820; font-size:13px;}
  #summary{position:sticky; top:0; background:#161512; padding:10px 0; font-size:16px; border-bottom:2px solid #444;}
</style>
</head>
<body>
<h1>Tests automatisés — Module RMN du proton</h1>
<p>Valide l'intégrité des données (compétences, spectres, questions) et la logique des moteurs de correction et de maîtrise. Charge et exécute le CODE RÉEL de l'application (pas une réimplémentation). Entièrement local, sans dépendance externe.</p>
<div id="summary">Exécution…</div>
<div id="results"></div>

<script src="../data/competences.js"></script>
<script src="../data/spectres.js"></script>
<script src="../data/cours.js"></script>
<script src="../data/methode.js"></script>
<script src="../data/diagnostic-initial.js"></script>
<script src="../data/activites.js"></script>
<script src="../data/diagnostics-sortie.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/grading-engine.js"></script>
<script src="../js/mastery-engine.js"></script>
<script src="../js/multiplet-svg.js"></script>

<script>
(function(){
  const cases = [];
  let pass = 0, fail = 0;
  function assert(name, cond, detail){
    cases.push({ name, ok: !!cond, detail: detail || '' });
    if (cond) pass++; else fail++;
  }
  function uniqueIds(arr, label){
    const ids = arr.map(x => x.id);
    const dupes = ids.filter((id, i) => ids.indexOf(id) !== i);
    assert(`${label} : identifiants uniques`, dupes.length === 0, dupes.join(', '));
  }

  // ============================================================ DONNÉES
  assert('7 compétences définies (C1 à C7)', window.RMN_COMPETENCES.length === 7);
  uniqueIds(window.RMN_COMPETENCES, 'Compétences');

  assert('Diagnostic initial : au moins 10 questions', window.RMN_DIAGNOSTIC_INITIAL.length >= 10, 'trouvé ' + window.RMN_DIAGNOSTIC_INITIAL.length);
  uniqueIds(window.RMN_DIAGNOSTIC_INITIAL, 'Diagnostic initial');
  {
    const covered = new Set();
    window.RMN_DIAGNOSTIC_INITIAL.forEach(q => (q.competences || []).forEach(c => covered.add(c)));
    assert('Diagnostic initial : les 7 compétences sont couvertes', window.RMN_COMPETENCES.every(c => covered.has(c.id)), [...covered].join(','));
  }

  assert('6 activités définies', window.RMN_ACTIVITES.length === 6);
  window.RMN_ACTIVITES.forEach(a => {
    assert(`Activité ${a.id} : 3 à 5 exercices`, a.exercices.length >= 3 && a.exercices.length <= 5, 'trouvé ' + a.exercices.length);
    uniqueIds(a.exercices, 'Activité ' + a.id);
  });

  const dKeys = ['D1', 'D2', 'D3', 'D4', 'D5', 'D6'];
  assert('6 diagnostics de sortie définis (D1 à D6)', dKeys.every(k => !!window.RMN_DIAGNOSTICS_SORTIE[k]));
  dKeys.forEach(k => {
    const def = window.RMN_DIAGNOSTICS_SORTIE[k];
    assert(`${k} : au moins 5 questions`, def.questions.length >= 5, 'trouvé ' + def.questions.length);
    uniqueIds(def.questions, k);
  });

  // Aucune question de diagnostic de sortie ne doit réutiliser l'identifiant
  // (ni l'énoncé exact) d'une question du diagnostic initial ou d'une activité.
  {
    const initIds = new Set(window.RMN_DIAGNOSTIC_INITIAL.map(q => q.id));
    const actIds = new Set();
    window.RMN_ACTIVITES.forEach(a => a.exercices.forEach(e => actIds.add(e.id)));
    let overlap = [];
    dKeys.forEach(k => window.RMN_DIAGNOSTICS_SORTIE[k].questions.forEach(q => {
      if (initIds.has(q.id) || actIds.has(q.id)) overlap.push(q.id);
    }));
    assert('Diagnostics de sortie : aucun identifiant réutilisé du diagnostic initial ou des activités', overlap.length === 0, overlap.join(','));
  }

  assert('Banque de remédiation : une question pour chacune des 7 compétences', window.RMN_COMPETENCES.every(c => window.RMN_REMEDIATION[c.id] && window.RMN_REMEDIATION[c.id].length >= 1));

  assert('Au moins 6 spectres de référence', window.RMN_SPECTRES.length >= 6, 'trouvé ' + window.RMN_SPECTRES.length);
  window.RMN_SPECTRES.forEach(s => {
    assert(`Spectre ${s.id} : statut documenté (reconstruction ou experimental)`, s.statut === 'reconstruction' || s.statut === 'experimental');
    assert(`Spectre ${s.id} : au moins un signal`, s.signaux && s.signaux.length >= 1);
    const sumH = s.signaux.reduce((a, b) => a + b.integrationH, 0);
    assert(`Spectre ${s.id} : la somme des intégrations est cohérente avec la formule brute`, sumH > 0);
  });

  // Toutes les questions à choix unique doivent avoir un index "correct" valide.
  function checkSingleQuestions(list, label){
    list.forEach(q => {
      if (q.type === 'single'){
        assert(`${label} ${q.id} : index correct valide`, Number.isInteger(q.correct) && q.correct >= 0 && q.correct < q.options.length);
      }
      if (q.type === 'multi'){
        assert(`${label} ${q.id} : indices corrects valides`, Array.isArray(q.correct) && q.correct.every(i => i >= 0 && i < q.options.length));
      }
      if (q.type === 'numeric'){
        assert(`${label} ${q.id} : réponse numérique définie`, typeof q.reponse === 'number');
      }
    });
  }
  checkSingleQuestions(window.RMN_DIAGNOSTIC_INITIAL, 'Diagnostic initial');
  window.RMN_ACTIVITES.forEach(a => checkSingleQuestions(a.exercices, 'Activité ' + a.id));
  dKeys.forEach(k => checkSingleQuestions(window.RMN_DIAGNOSTICS_SORTIE[k].questions, k));

  // ============================================================ MOTEUR DE CORRECTION
  (function(){
    const qSingle = { type: 'single', correct: 1, options: ['a', 'b', 'c'] };
    assert('gradeQuestion single : bonne réponse', window.GradingEngine.gradeQuestion(qSingle, 1).correct === true);
    assert('gradeQuestion single : mauvaise réponse', window.GradingEngine.gradeQuestion(qSingle, 0).correct === false);

    const qMulti = { type: 'multi', correct: [0, 2], options: ['a', 'b', 'c', 'd'] };
    assert('gradeQuestion multi : correspondance exacte -> crédit plein', window.GradingEngine.gradeQuestion(qMulti, [0, 2]).fraction === 1);
    const partial = window.GradingEngine.gradeQuestion(qMulti, [0]);
    assert('gradeQuestion multi : réponse partielle -> fraction < 1 et pas de crédit plein', partial.fraction === 0.5 && partial.correct === false);
    const withWrong = window.GradingEngine.gradeQuestion(qMulti, [0, 2, 1]);
    assert('gradeQuestion multi : une proposition fausse cochée en plus -> pas le maximum', withWrong.correct === false && withWrong.fraction < 1,
      'fraction=' + withWrong.fraction);
    const allWrong = window.GradingEngine.gradeQuestion({ type: 'multi', correct: [0], options: ['a', 'b'] }, [1]);
    assert('gradeQuestion multi : tout faux -> fraction plancher à 0 (jamais négative)', allWrong.fraction === 0);

    const qNumAbs = { type: 'numeric', reponse: 2.70, tolerance: { type: 'abs', value: 0.05 } };
    assert('gradeQuestion numeric (abs) : dans la tolérance', window.GradingEngine.gradeQuestion(qNumAbs, 2.72).correct === true);
    assert('gradeQuestion numeric (abs) : hors tolérance', window.GradingEngine.gradeQuestion(qNumAbs, 2.80).correct === false);

    const qNumPct = { type: 'numeric', reponse: 100, tolerance: { type: 'pct', value: 5 } };
    assert('gradeQuestion numeric (pct) : dans la tolérance', window.GradingEngine.gradeQuestion(qNumPct, 104).correct === true);
    assert('gradeQuestion numeric (pct) : hors tolérance', window.GradingEngine.gradeQuestion(qNumPct, 110).correct === false);

    const qNumExact = { type: 'numeric', reponse: 4, tolerance: { type: 'abs', value: 0 } };
    assert('gradeQuestion numeric : un nombre entier de protons/raies exige une réponse exacte', window.GradingEngine.gradeQuestion(qNumExact, 3.9).correct === false);
  })();

  // ============================================================ MOTEUR DE MULTIPLETS
  (function(){
    const pascal4 = window.MultipletSVG.pascalRow(4);
    assert('Triangle de Pascal n=4 : [1,4,6,4,1]', JSON.stringify(pascal4) === JSON.stringify([1, 4, 6, 4, 1]));

    const simple = window.MultipletSVG.buildMultipletLines([{ n: 3, J: 7 }]);
    assert('Multiplet simple n=3 (quadruplet) : 4 raies', simple.length === 4, 'trouvé ' + simple.length);

    const superposed = window.MultipletSVG.buildMultipletLines([{ n: 2, J: 7 }, { n: 1, J: 7 }], 1e-6);
    assert('J1=J2 : superposition totale -> (2+1+1)=4 raies, comme n+1 avec n=3', superposed.length === 4, 'trouvé ' + superposed.length);

    const resolved = window.MultipletSVG.buildMultipletLines([{ n: 2, J: 7 }, { n: 1, J: 2 }], 1e-6);
    assert('J1≠J2 (nettement) : aucune superposition -> (2+1)×(1+1)=6 raies', resolved.length === 6, 'trouvé ' + resolved.length);

    const total = superposed.reduce((a, b) => a + b.intensity, 0) + 0; // normalisé, test de forme uniquement
    assert('Intensités normalisées : la raie la plus intense vaut 1', Math.max(...superposed.map(l => l.intensity)) === 1);
  })();

  // ============================================================ MOTEUR DE MAÎTRISE
  (function(){
    assert('sessionLevel : acc=0 -> niveau 0', window.MasteryEngine.sessionLevel(0, 0) === 0);
    assert('sessionLevel : acc=1, maxDiff=1 -> niveau 3 (jamais 4 sur des questions faciles)', window.MasteryEngine.sessionLevel(1, 1) === 3);
    assert('sessionLevel : acc=1, maxDiff=3 -> niveau 4', window.MasteryEngine.sessionLevel(1, 3) === 4);
    assert('sessionLevel : 0<acc<0.5 -> niveau 1', window.MasteryEngine.sessionLevel(0.3, 2) === 1);
    assert('sessionLevel : 0.5<=acc<1, maxDiff<3 -> niveau 2', window.MasteryEngine.sessionLevel(0.6, 2) === 2);

    // Aucune preuve -> compétence non évaluée (jamais confondue avec un niveau 0)
    let state = window.RmnStorage.defaultState();
    let levels = window.MasteryEngine.computeLevels(state);
    assert('Aucune évaluation -> toutes les compétences sont "non évaluées" (null), jamais 0 par défaut',
      window.RMN_COMPETENCES.every(c => levels[c.id] === null));
    let g = window.MasteryEngine.computeGlobalPct(levels);
    assert('Score global sans aucune évaluation : null (pas 0%)', g.pct === null);

    // Preuves injectées avec des horodatages explicites (plutôt que Date.now())
    // pour un test déterministe, non sensible à la résolution de l'horloge.
    function pushEvidence(state, ts, records){
      records.forEach(r => state.evidence.push(Object.assign({ timestamp: ts }, r)));
    }

    // Diagnostic initial : même avec 100% de réussite, le niveau est plafonné à 2.
    state = window.RmnStorage.defaultState();
    pushEvidence(state, 1000, [
      { competence: 'C1', correct: true, difficulte: 3, source: 'initial' },
      { competence: 'C1', correct: true, difficulte: 3, source: 'initial' }
    ]);
    levels = window.MasteryEngine.computeLevels(state);
    assert('Diagnostic initial parfait -> niveau plafonné à 2 (pas 4)', levels.C1 === 2, 'obtenu ' + levels.C1);

    // Un diagnostic de sortie réussi avec des questions difficiles peut atteindre le niveau 4.
    pushEvidence(state, 2000, [
      { competence: 'C1', correct: true, difficulte: 4, source: 'D1' },
      { competence: 'C1', correct: true, difficulte: 3, source: 'D1' }
    ]);
    levels = window.MasteryEngine.computeLevels(state);
    assert('Diagnostic de sortie D1 parfait sur questions difficiles -> niveau 4 possible', levels.C1 === 4, 'obtenu ' + levels.C1);

    // La maîtrise peut ensuite DIMINUER si une évaluation ultérieure révèle une difficulté
    // (seule la session la plus récente compte, pas une moyenne de tout l'historique).
    pushEvidence(state, 3000, [
      { competence: 'C1', correct: false, difficulte: 2, source: 'D2' },
      { competence: 'C1', correct: false, difficulte: 2, source: 'D2' }
    ]);
    levels = window.MasteryEngine.computeLevels(state);
    assert('Un échec lors d\'un diagnostic ultérieur fait DIMINUER le niveau (pas de moyenne cumulative)', levels.C1 === 0, 'obtenu ' + levels.C1);

    // Les exercices d'activité seuls (sans evidence ajoutée) ne doivent jamais faire progresser la maîtrise.
    state = window.RmnStorage.defaultState();
    state.activites['A1'] = { exercices: { 'a1-ex1': { correct: true } }, completed: true, exerciseIndex: 4 };
    levels = window.MasteryEngine.computeLevels(state);
    assert('Activité terminée sans diagnostic -> compétences toujours "non évaluées"', window.RMN_COMPETENCES.every(c => levels[c.id] === null));
  })();

  // ============================================================ STORAGE
  (function(){
    const d = window.RmnStorage.defaultState();
    assert('État par défaut : diagnostic initial non fait', d.diagnosticInitial.done === false);
    assert('État par défaut : historique de maîtrise vide', Array.isArray(d.masteryHistory) && d.masteryHistory.length === 0);
  })();

  // ============================================================ RENDU
  document.getElementById('summary').innerHTML =
    `<span class="${fail === 0 ? 'pass' : 'fail'}">${pass} / ${pass + fail} tests réussis</span>` +
    (fail > 0 ? ` — <span class="fail">${fail} échec(s)</span>` : ' — tout est vert.');
  document.getElementById('results').innerHTML = cases.map(c =>
    `<div class="case ${c.ok ? 'pass' : 'fail'}">${c.ok ? '✓' : '✗'} ${c.name}${c.detail ? ' — ' + c.detail : ''}</div>`
  ).join('');
})();
</script>
</body>
</html>

<svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="12.5">
  <rect width="520" height="340" fill="#FBF8F0"/>

  <!-- Panneau 1 : flexion -->
  <text x="30" y="26" font-weight="bold" fill="#262319">Flexion de l'avant-bras</text>
  <line x1="90" y1="45" x2="90" y2="140" stroke="#4C5B66" stroke-width="6" stroke-linecap="round"/>
  <circle cx="90" cy="140" r="5" fill="#262319"/>
  <line x1="90" y1="140" x2="160" y2="90" stroke="#4C5B66" stroke-width="6" stroke-linecap="round"/>

  <path d="M 80 60 Q 56 100 82 130" stroke="#A6512B" stroke-width="14" fill="none" stroke-linecap="round"/>
  <text x="20" y="102" fill="#7E3A1D" font-size="11" font-weight="bold">Biceps</text>
  <text x="10" y="115" fill="#7E3A1D" font-size="11" font-weight="bold">contracté</text>

  <path d="M 100 60 Q 120 100 102 130" stroke="#4C5B66" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.35"/>
  <text x="116" y="102" fill="#4C5B66" font-size="11" opacity="0.7">Triceps</text>
  <text x="112" y="115" fill="#4C5B66" font-size="11" opacity="0.7">relâché</text>

  <!-- Panneau 2 : extension -->
  <text x="300" y="26" font-weight="bold" fill="#262319">Extension de l'avant-bras</text>
  <line x1="360" y1="45" x2="360" y2="140" stroke="#4C5B66" stroke-width="6" stroke-linecap="round"/>
  <circle cx="360" cy="140" r="5" fill="#262319"/>
  <line x1="360" y1="140" x2="360" y2="220" stroke="#4C5B66" stroke-width="6" stroke-linecap="round"/>

  <path d="M 350 60 Q 328 100 352 130" stroke="#A6512B" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.35"/>
  <text x="284" y="102" fill="#7E3A1D" font-size="11" opacity="0.7">Biceps</text>
  <text x="280" y="115" fill="#7E3A1D" font-size="11" opacity="0.7">relâché</text>

  <path d="M 370 60 Q 392 100 368 130" stroke="#4C5B66" stroke-width="14" fill="none" stroke-linecap="round"/>
  <text x="386" y="102" fill="#4C5B66" font-size="11" font-weight="bold">Triceps</text>
  <text x="382" y="115" fill="#4C5B66" font-size="11" font-weight="bold">contracté</text>

  <line x1="30" y1="250" x2="490" y2="250" stroke="#D8CDAF"/>
  <text x="260" y="272" text-anchor="middle" fill="#524c3e" font-size="12">Le muscle contracté (plein) tire sur l'os ;</text>
  <text x="260" y="290" text-anchor="middle" fill="#524c3e" font-size="12">l'antagoniste se relâche (couleur pâle).</text>
  <text x="260" y="312" text-anchor="middle" fill="#524c3e" font-size="12">Aucun muscle ne peut « pousser » : le mouvement inverse</text>
  <text x="260" y="330" text-anchor="middle" fill="#524c3e" font-size="12">mobilise l'autre muscle de la paire antagoniste.</text>
</svg>

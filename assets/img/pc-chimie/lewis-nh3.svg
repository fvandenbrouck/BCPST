<svg viewBox="0 0 340 260" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', 'Arial', sans-serif">
  <rect x="0" y="0" width="340" height="260" fill="#FBF8F0"/>

  <!-- Liaisons N-H (doublets liants) -->
  <line x1="170" y1="130" x2="170" y2="190" stroke="#262319" stroke-width="3" stroke-linecap="round"/>
  <line x1="150" y1="118" x2="98" y2="150" stroke="#262319" stroke-width="3" stroke-linecap="round"/>
  <line x1="190" y1="118" x2="242" y2="150" stroke="#262319" stroke-width="3" stroke-linecap="round"/>

  <!-- Doublet non liant sur N (un seul doublet, un trait) -->
  <line x1="152" y1="76" x2="188" y2="76" stroke="#262319" stroke-width="3" stroke-linecap="round"/>

  <!-- Atomes -->
  <text x="170" y="118" font-size="30" font-weight="700" fill="#262319" text-anchor="middle">N</text>
  <text x="170" y="213" font-size="27" font-weight="700" fill="#4C5B66" text-anchor="middle">H</text>
  <text x="80" y="168" font-size="27" font-weight="700" fill="#4C5B66" text-anchor="middle">H</text>
  <text x="260" y="168" font-size="27" font-weight="700" fill="#4C5B66" text-anchor="middle">H</text>
</svg>

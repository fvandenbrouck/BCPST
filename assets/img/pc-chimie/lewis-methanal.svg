<svg viewBox="0 0 340 260" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', 'Arial', sans-serif">
  <rect x="0" y="0" width="340" height="260" fill="#FBF8F0"/>

  <!-- Double liaison C=O (deux doublets liants) -->
  <line x1="163" y1="160" x2="163" y2="100" stroke="#262319" stroke-width="3" stroke-linecap="round"/>
  <line x1="177" y1="160" x2="177" y2="100" stroke="#262319" stroke-width="3" stroke-linecap="round"/>

  <!-- Liaisons C-H (doublets liants) -->
  <line x1="150" y1="180" x2="105" y2="210" stroke="#262319" stroke-width="3" stroke-linecap="round"/>
  <line x1="190" y1="180" x2="235" y2="210" stroke="#262319" stroke-width="3" stroke-linecap="round"/>

  <!-- Doublets non liants sur O (deux doublets, tangents aux points cardinaux NO et NE de la lettre O) -->
  <line x1="152" y1="72" x2="165" y2="59" stroke="#262319" stroke-width="3" stroke-linecap="round"/>
  <line x1="175" y1="59" x2="188" y2="72" stroke="#262319" stroke-width="3" stroke-linecap="round"/>

  <!-- Atomes -->
  <text x="170" y="88" font-size="30" font-weight="700" fill="#4C5B66" text-anchor="middle">O</text>
  <text x="170" y="180" font-size="30" font-weight="700" fill="#262319" text-anchor="middle">C</text>
  <text x="93" y="228" font-size="27" font-weight="700" fill="#4C5B66" text-anchor="middle">H</text>
  <text x="247" y="228" font-size="27" font-weight="700" fill="#4C5B66" text-anchor="middle">H</text>
</svg>

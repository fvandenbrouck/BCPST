<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="320" height="260" fill="#FBF8F0"/>

  <!-- Radiolarites (sédiments marins), au sommet -->
  <rect x="60" y="30" width="200" height="35" fill="#5F6F42" fill-opacity="0.30" stroke="#D8CDAF"/>
  <text x="70" y="52" font-size="12" fill="#262319">Radiolarites (sédiments)</text>

  <!-- Basaltes en coussins -->
  <rect x="60" y="65" width="200" height="55" fill="#A6512B" fill-opacity="0.30" stroke="#D8CDAF"/>
  <circle cx="95" cy="90" r="10" fill="#A6512B" fill-opacity="0.5"/>
  <circle cx="120" cy="100" r="9" fill="#A6512B" fill-opacity="0.5"/>
  <circle cx="145" cy="88" r="8" fill="#A6512B" fill-opacity="0.5"/>
  <text x="165" y="97" font-size="12" fill="#262319">Basaltes en coussins</text>

  <!-- Gabbro -->
  <rect x="60" y="120" width="200" height="60" fill="#C89B3C" fill-opacity="0.30" stroke="#D8CDAF"/>
  <text x="70" y="155" font-size="12" fill="#262319">Gabbro</text>

  <!-- Péridotite / serpentinite (manteau) -->
  <rect x="60" y="180" width="200" height="55" fill="#4C5B66" fill-opacity="0.30" stroke="#D8CDAF"/>
  <text x="70" y="210" font-size="12" fill="#262319">Péridotite / serpentinite</text>
  <text x="70" y="225" font-size="11" fill="#524c3e">(manteau)</text>

  <!-- Accolade -->
  <path d="M40,30 L30,30 L30,235 L40,235" fill="none" stroke="#7E3A1D" stroke-width="1.5"/>
  <text x="10" y="132" font-size="12" fill="#7E3A1D" transform="rotate(-90 10,132)">Colonne ophiolitique</text>
</svg>

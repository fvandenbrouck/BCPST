<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="320" height="220" fill="#FBF8F0"/>

  <!-- Terrain autochtone (jeune), en dessous -->
  <rect x="20" y="120" width="280" height="80" fill="#EAE1CB" stroke="#D8CDAF"/>
  <text x="30" y="150" font-size="12" fill="#262319">Terrain autochtone</text>
  <text x="30" y="166" font-size="11" fill="#524c3e">(en place, plus jeune)</text>

  <!-- Faille de chevauchement, ligne ondulée avec dents -->
  <path d="M20,120 Q90,110 160,122 T300,115" fill="none" stroke="#A6512B" stroke-width="3"/>
  <polygon points="70,116 78,108 82,118" fill="#A6512B"/>
  <polygon points="140,120 148,111 152,122" fill="#A6512B"/>
  <polygon points="220,117 228,108 232,119" fill="#A6512B"/>
  <text x="205" y="100" font-size="11" fill="#7E3A1D">Faille de chevauchement</text>

  <!-- Nappe : terrain plus ancien charrié par-dessus -->
  <rect x="20" y="30" width="280" height="88" fill="#C89B3C" fill-opacity="0.35" stroke="#7E3A1D"/>
  <text x="30" y="55" font-size="12" fill="#262319">Nappe charriée</text>
  <text x="30" y="71" font-size="11" fill="#524c3e">(terrain plus ancien, transporté)</text>

  <!-- Flèche indiquant le sens de déplacement -->
  <path d="M240,45 L280,45" stroke="#524c3e" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#524c3e"/>
    </marker>
  </defs>
</svg>

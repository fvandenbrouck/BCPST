<svg viewBox="0 0 440 420" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', 'Arial', sans-serif">
  <rect x="0" y="0" width="440" height="420" fill="#FBF8F0"/>

  <!-- Contour du carré avec quatre coupures pour les dipoles D1(bas) D2(droite) D3(haut) D4(gauche) -->
  <line x1="90" y1="90" x2="187.5" y2="90" stroke="#262319" stroke-width="1.8"/>
  <line x1="252.5" y1="90" x2="350" y2="90" stroke="#262319" stroke-width="1.8"/>
  <line x1="350" y1="90" x2="350" y2="187.5" stroke="#262319" stroke-width="1.8"/>
  <line x1="350" y1="252.5" x2="350" y2="350" stroke="#262319" stroke-width="1.8"/>
  <line x1="350" y1="350" x2="252.5" y2="350" stroke="#262319" stroke-width="1.8"/>
  <line x1="187.5" y1="350" x2="90" y2="350" stroke="#262319" stroke-width="1.8"/>
  <line x1="90" y1="350" x2="90" y2="252.5" stroke="#262319" stroke-width="1.8"/>
  <line x1="90" y1="187.5" x2="90" y2="90" stroke="#262319" stroke-width="1.8"/>

  <!-- Boites des dipoles -->
  <rect x="187.5" y="77" width="65" height="26" fill="#FBF8F0" stroke="#262319" stroke-width="1.8"/>
  <text x="220" y="68" font-size="18" font-weight="700" fill="#262319" text-anchor="middle">D₃</text>

  <rect x="337" y="187.5" width="26" height="65" fill="#FBF8F0" stroke="#262319" stroke-width="1.8"/>
  <text x="392" y="224" font-size="18" font-weight="700" fill="#262319" text-anchor="middle">D₂</text>

  <rect x="187.5" y="337" width="65" height="26" fill="#FBF8F0" stroke="#262319" stroke-width="1.8"/>
  <text x="220" y="380" font-size="18" font-weight="700" fill="#262319" text-anchor="middle">D₁</text>

  <rect x="77" y="187.5" width="26" height="65" fill="#FBF8F0" stroke="#262319" stroke-width="1.8"/>
  <text x="48" y="224" font-size="18" font-weight="700" fill="#262319" text-anchor="middle">D₄</text>

  <!-- Sens de parcours arbitraire (fleche incurvee CCW) + repere -->
  <path d="M 280.1,280.1 A 85,85 0 0 0 159.9,159.9 A 85,85 0 0 0 159.9,280.1" fill="none" stroke="#262319" stroke-width="1.8"/>
  <polygon points="164.5,284.7 152.1,278.7 158.5,272.3" fill="#262319"/>
  <circle cx="220.0" cy="305.0" r="10" fill="none" stroke="#262319" stroke-width="1.5"/>
  <line x1="213.0" y1="305.0" x2="227.0" y2="305.0" stroke="#262319" stroke-width="1.5"/>
  <line x1="220.0" y1="298.0" x2="220.0" y2="312.0" stroke="#262319" stroke-width="1.5"/>

  <!-- u1 : bas, sens du parcours -> vers la droite -->
  <line x1="150" y1="382" x2="288" y2="382" stroke="#5F6F42" stroke-width="1.8"/>
  <polygon points="293.5,382.0 282.5,386.0 282.5,378.0" fill="#5F6F42"/>
  <text x="219" y="405" font-size="20" font-style="italic" fill="#5F6F42" text-anchor="middle">u<tspan font-size="14" dy="4">1</tspan></text>

  <!-- u3 : haut, sens du parcours -> vers la gauche -->
  <line x1="288" y1="58" x2="150" y2="58" stroke="#5F6F42" stroke-width="1.8"/>
  <polygon points="144.5,58.0 155.5,54.0 155.5,62.0" fill="#5F6F42"/>
  <text x="219" y="42" font-size="20" font-style="italic" fill="#5F6F42" text-anchor="middle">u<tspan font-size="14" dy="4">3</tspan></text>

  <!-- u2 : droite, oppose au parcours -> vers le bas -->
  <line x1="382" y1="152" x2="382" y2="290" stroke="#5F6F42" stroke-width="1.8"/>
  <polygon points="382.0,295.5 378.0,284.5 386.0,284.5" fill="#5F6F42"/>
  <text x="405" y="227" font-size="20" font-style="italic" fill="#5F6F42">u<tspan font-size="14" dy="4">2</tspan></text>

  <!-- u4 : gauche, oppose au parcours -> vers le haut -->
  <line x1="58" y1="290" x2="58" y2="152" stroke="#5F6F42" stroke-width="1.8"/>
  <polygon points="58.0,146.5 62.0,157.5 54.0,157.5" fill="#5F6F42"/>
  <text x="18" y="227" font-size="20" font-style="italic" fill="#5F6F42">u<tspan font-size="14" dy="4">4</tspan></text>

  <!-- courant i, cote droit, pres du coin haut -->
  <line x1="350" y1="112" x2="350" y2="160" stroke="#A6512B" stroke-width="1.8"/>
  <polygon points="350.0,165.5 346.0,154.5 354.0,154.5" fill="#A6512B"/>
  <text x="360" y="140" font-size="20" font-style="italic" fill="#A6512B">i</text>
</svg>

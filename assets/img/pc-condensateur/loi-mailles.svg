<svg viewBox="0 0 440 400" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', 'Arial', sans-serif">
  <rect x="0" y="0" width="440" height="400" fill="#FBF8F0"/>

  <!-- Carré : coins -->
  <!-- Haut : D1, wires puis boîte -->
  <line x1="90" y1="90" x2="175" y2="90" stroke="#262319" stroke-width="2.5"/>
  <line x1="255" y1="90" x2="340" y2="90" stroke="#262319" stroke-width="2.5"/>
  <rect x="175" y="76" width="80" height="28" fill="#FBF8F0" stroke="#262319" stroke-width="2.5"/>
  <text x="215" y="68" font-size="22" font-weight="700" fill="#262319" text-anchor="middle">D₁</text>

  <!-- Droite : D2 -->
  <line x1="340" y1="90" x2="340" y2="160" stroke="#262319" stroke-width="2.5"/>
  <line x1="340" y1="240" x2="340" y2="310" stroke="#262319" stroke-width="2.5"/>
  <rect x="326" y="160" width="28" height="80" fill="#FBF8F0" stroke="#262319" stroke-width="2.5"/>
  <text x="378" y="204" font-size="22" font-weight="700" fill="#262319" text-anchor="middle">D₂</text>

  <!-- Bas : D3 -->
  <line x1="340" y1="310" x2="255" y2="310" stroke="#262319" stroke-width="2.5"/>
  <line x1="175" y1="310" x2="90" y2="310" stroke="#262319" stroke-width="2.5"/>
  <rect x="175" y="296" width="80" height="28" fill="#FBF8F0" stroke="#262319" stroke-width="2.5"/>
  <text x="215" y="340" font-size="22" font-weight="700" fill="#262319" text-anchor="middle">D₃</text>

  <!-- Gauche : D4 -->
  <line x1="90" y1="310" x2="90" y2="240" stroke="#262319" stroke-width="2.5"/>
  <line x1="90" y1="160" x2="90" y2="90" stroke="#262319" stroke-width="2.5"/>
  <rect x="76" y="160" width="28" height="80" fill="#FBF8F0" stroke="#262319" stroke-width="2.5"/>
  <text x="52" y="204" font-size="22" font-weight="700" fill="#262319" text-anchor="middle">D₄</text>

  <!-- Sens de parcours arbitraire : flèche incurvée + repère ⊕ -->
  <path d="M 290,120 C 345,155 340,255 255,278 C 220,288 190,282 168,268" fill="none" stroke="#A6512B" stroke-width="2.5"/>
  <polygon points="168,268 184,262 180,278" fill="#A6512B"/>
  <circle cx="200" cy="200" r="12" fill="none" stroke="#A6512B" stroke-width="2"/>
  <line x1="194" y1="200" x2="206" y2="200" stroke="#A6512B" stroke-width="2"/>
  <line x1="200" y1="194" x2="200" y2="206" stroke="#A6512B" stroke-width="2"/>

  <!-- Tensions : u1 (haut, associée à D1, sens du parcours = vers la droite), u3 (bas, associée à D3, sens du parcours = vers la gauche) -->
  <line x1="180" y1="45" x2="255" y2="45" stroke="#5F6F42" stroke-width="2.5"/>
  <polygon points="255,45 241,39 241,51" fill="#5F6F42"/>
  <text x="217" y="32" font-size="22" font-weight="700" fill="#5F6F42" text-anchor="middle">u₁</text>

  <line x1="255" y1="345" x2="180" y2="345" stroke="#5F6F42" stroke-width="2.5"/>
  <polygon points="180,345 194,339 194,351" fill="#5F6F42"/>
  <text x="217" y="368" font-size="22" font-weight="700" fill="#5F6F42" text-anchor="middle">u₃</text>

  <!-- u2 (droite, opposé au parcours = vers le haut), u4 (gauche, opposé au parcours = vers le bas) -->
  <line x1="395" y1="240" x2="395" y2="160" stroke="#5F6F42" stroke-width="2.5"/>
  <polygon points="395,160 389,174 401,174" fill="#5F6F42"/>
  <text x="418" y="204" font-size="22" font-weight="700" fill="#5F6F42" text-anchor="middle">u₂</text>

  <line x1="35" y1="160" x2="35" y2="240" stroke="#5F6F42" stroke-width="2.5"/>
  <polygon points="35,240 29,226 41,226" fill="#5F6F42"/>
  <text x="18" y="204" font-size="22" font-weight="700" fill="#5F6F42" text-anchor="middle">u₄</text>

  <!-- Équation -->
  <text x="220" y="392" font-size="24" fill="#262319" text-anchor="middle">u₁ − u₂ + u₃ − u₄ = 0</text>
</svg>

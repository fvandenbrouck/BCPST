<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', 'Arial', sans-serif">
  <rect x="0" y="0" width="480" height="300" fill="#FBF8F0"/>

  <!-- Fil du bas -->
  <line x1="80" y1="240" x2="360" y2="240" stroke="#262319" stroke-width="1.8"/>

  <!-- Gauche : simple fil (pas de generateur) -->
  <line x1="80" y1="60" x2="80" y2="240" stroke="#262319" stroke-width="1.8"/>
  

  <!-- Haut : resistance R -->
  <line x1="80" y1="60" x2="180" y2="60" stroke="#262319" stroke-width="1.8"/>
  <line x1="260" y1="60" x2="360" y2="60" stroke="#262319" stroke-width="1.8"/>
  <rect x="180" y="47" width="80" height="26" fill="#FBF8F0" stroke="#262319" stroke-width="1.8"/>
  <text x="220" y="38" font-size="20" font-weight="700" fill="#262319" text-anchor="middle">R</text>
  <polygon points="305.5,60.0 294.5,64.0 294.5,56.0" fill="#A6512B"/>
  <text x="296" y="42" font-size="20" font-style="italic" fill="#A6512B">i</text>

  <!-- Droite : condensateur C -->
  <line x1="360" y1="60" x2="360" y2="138" stroke="#262319" stroke-width="1.8"/>
  <line x1="360" y1="162" x2="360" y2="240" stroke="#262319" stroke-width="1.8"/>
  <line x1="345" y1="140" x2="375" y2="140" stroke="#262319" stroke-width="2.4"/>
  <line x1="345" y1="160" x2="375" y2="160" stroke="#262319" stroke-width="2.4"/>
  <text x="325" y="157" font-size="20" font-weight="700" fill="#262319" text-anchor="middle">C</text>
  <line x1="400" y1="200" x2="400" y2="108" stroke="#5F6F42" stroke-width="1.8"/>
  <polygon points="400.0,102.5 404.0,113.5 396.0,113.5" fill="#5F6F42"/>
  <text x="418" y="155" font-size="20" font-weight="700" fill="#5F6F42">u<tspan font-size="14" dy="4">C</tspan></text>
</svg>

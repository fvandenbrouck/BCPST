<svg viewBox="0 0 470 300" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', 'Arial', sans-serif">
  <rect x="0" y="0" width="470" height="300" fill="#FBF8F0"/>

  <!-- Contour du circuit -->
  <line x1="80" y1="240" x2="360" y2="240" stroke="#262319" stroke-width="2.5"/>

  <!-- Gauche : source idéale E -->
  <line x1="80" y1="60" x2="80" y2="128" stroke="#262319" stroke-width="2.5"/>
  <line x1="80" y1="172" x2="80" y2="240" stroke="#262319" stroke-width="2.5"/>
  <circle cx="80" cy="150" r="22" fill="#FBF8F0" stroke="#262319" stroke-width="2.5"/>
  <line x1="40" y1="180" x2="40" y2="120" stroke="#5F6F42" stroke-width="2.5"/>
  <polygon points="40,120 34,134 46,134" fill="#5F6F42"/>
  <text x="30" y="158" font-size="24" font-weight="700" fill="#5F6F42" text-anchor="middle">E</text>

  <!-- Haut : résistance R -->
  <line x1="80" y1="60" x2="180" y2="60" stroke="#262319" stroke-width="2.5"/>
  <line x1="260" y1="60" x2="360" y2="60" stroke="#262319" stroke-width="2.5"/>
  <rect x="180" y="47" width="80" height="26" fill="#FBF8F0" stroke="#262319" stroke-width="2.5"/>
  <text x="220" y="38" font-size="24" font-weight="700" fill="#262319" text-anchor="middle">R</text>
  <polygon points="288,54 302,60 288,66" fill="#7E3A1D"/>
  <text x="296" y="42" font-size="22" font-weight="700" fill="#7E3A1D">i</text>

  <!-- Droite : condensateur C -->
  <line x1="360" y1="60" x2="360" y2="138" stroke="#262319" stroke-width="2.5"/>
  <line x1="360" y1="162" x2="360" y2="240" stroke="#262319" stroke-width="2.5"/>
  <line x1="345" y1="140" x2="375" y2="140" stroke="#262319" stroke-width="3"/>
  <line x1="345" y1="160" x2="375" y2="160" stroke="#262319" stroke-width="3"/>
  <text x="325" y="157" font-size="24" font-weight="700" fill="#262319" text-anchor="middle">C</text>
  <line x1="400" y1="200" x2="400" y2="105" stroke="#5F6F42" stroke-width="2.5"/>
  <polygon points="400,105 394,119 406,119" fill="#5F6F42"/>
  <text x="418" y="155" font-size="24" font-weight="700" fill="#5F6F42">u<tspan font-size="16" dy="4">C</tspan></text>
</svg>

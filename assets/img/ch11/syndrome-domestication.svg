<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="12.5">
  <rect x="0" y="0" width="420" height="320" fill="#FBF8F0"/>

  <!-- En-têtes -->
  <rect x="10" y="10" width="195" height="34" rx="6" fill="#5F6F42"/>
  <text x="107" y="32" text-anchor="middle" fill="#fff" font-weight="bold">Ancêtre sauvage</text>
  <rect x="215" y="10" width="195" height="34" rx="6" fill="#C89B3C"/>
  <text x="312" y="32" text-anchor="middle" fill="#3f2f10" font-weight="bold">Plante domestiquée</text>

  <!-- Lignes de séparation -->
  <line x1="10" y1="58" x2="410" y2="58" stroke="#D8CDAF"/>
  <line x1="10" y1="108" x2="410" y2="108" stroke="#D8CDAF"/>
  <line x1="10" y1="158" x2="410" y2="158" stroke="#D8CDAF"/>
  <line x1="10" y1="208" x2="410" y2="208" stroke="#D8CDAF"/>
  <line x1="10" y1="258" x2="410" y2="258" stroke="#D8CDAF"/>
  <line x1="10" y1="308" x2="410" y2="308" stroke="#D8CDAF"/>

  <!-- Rangée 1 : dissémination -->
  <text x="15" y="53" font-weight="bold" fill="#262319">Graines / fruits</text>
  <text x="20" y="75" fill="#3f4a2c">Se détachent seuls à maturité</text>
  <text x="20" y="92" fill="#3f4a2c">(dissémination naturelle)</text>
  <text x="225" y="75" fill="#7E3A1D">Restent attachés à la plante</text>
  <text x="225" y="92" fill="#7E3A1D">(récolte facilitée)</text>

  <!-- Rangée 2 : taille -->
  <text x="15" y="103" font-weight="bold" fill="#262319">Taille des organes récoltés</text>
  <text x="20" y="125" fill="#3f4a2c">Petits</text>
  <text x="225" y="125" fill="#7E3A1D">Gros (gigantisme)</text>

  <!-- Rangée 3 : dormance -->
  <text x="15" y="153" font-weight="bold" fill="#262319">Dormance des graines</text>
  <text x="20" y="175" fill="#3f4a2c">Forte, germination étalée</text>
  <text x="225" y="175" fill="#7E3A1D">Faible, germination groupée</text>

  <!-- Rangée 4 : maturation -->
  <text x="15" y="203" font-weight="bold" fill="#262319">Maturation</text>
  <text x="20" y="225" fill="#3f4a2c">Étalée dans le temps</text>
  <text x="225" y="225" fill="#7E3A1D">Synchronisée</text>

  <!-- Rangée 5 : défenses -->
  <text x="15" y="253" font-weight="bold" fill="#262319">Défenses</text>
  <text x="20" y="275" fill="#3f4a2c">Épines, composés toxiques</text>
  <text x="225" y="275" fill="#7E3A1D">Réduites ou absentes</text>
  <text x="20" y="295" font-size="11" fill="#524c3e">Ces caractères préexistaient, sélectionnés par l'être humain</text>
</svg>

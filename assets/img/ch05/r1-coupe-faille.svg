<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="320" height="220" fill="#FBF8F0"/>
  <!-- Couche A (calcaire), la plus basse -->
  <rect x="20" y="150" width="280" height="60" fill="#EAE1CB" stroke="#D8CDAF"/>
  <!-- Couche B (grès) -->
  <rect x="20" y="95" width="280" height="55" fill="#C89B3C" fill-opacity="0.35" stroke="#D8CDAF"/>
  <!-- Couche C (sable), au sommet, non recoupée par la faille -->
  <rect x="20" y="30" width="280" height="65" fill="#5F6F42" fill-opacity="0.25" stroke="#D8CDAF"/>

  <!-- Faille F : recoupe A et B, s'arrête à la base de C -->
  <line x1="130" y1="210" x2="185" y2="95" stroke="#A6512B" stroke-width="3"/>
  <text x="192" y="110" font-size="13" font-weight="bold" fill="#7E3A1D">F</text>

  <!-- Léger décalage de part et d'autre de la faille, pour suggérer un jeu -->
  <line x1="20" y1="150" x2="150" y2="150" stroke="#D8CDAF" stroke-width="1"/>
  <line x1="163" y1="145" x2="300" y2="145" stroke="#D8CDAF" stroke-width="1"/>

  <text x="30" y="185" font-size="13" fill="#262319">A — calcaire</text>
  <text x="30" y="125" font-size="13" fill="#262319">B — grès</text>
  <text x="30" y="65" font-size="13" fill="#262319">C — sable</text>
</svg>

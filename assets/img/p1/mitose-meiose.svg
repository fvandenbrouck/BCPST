<svg viewBox="0 0 620 530" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="11.5">
  <rect x="0" y="0" width="620" height="530" fill="#FBF8F0"/>

  <!-- Cellule mère -->
  <rect x="210" y="15" width="200" height="90" rx="10" fill="#FBF8F0" stroke="#262319" stroke-width="1.5"/>
  <text x="310" y="35" text-anchor="middle" font-weight="bold" fill="#262319">Cellule mère</text>
  <text x="310" y="50" text-anchor="middle" font-size="10.5" fill="#524c3e">2n = 4 (paire A + paire B)</text>
  <rect x="270" y="60" width="8" height="30" fill="#A6512B"/>
  <rect x="283" y="60" width="8" height="30" fill="#A6512B" fill-opacity="0.4"/>
  <rect x="329" y="60" width="8" height="30" fill="#4C5B66"/>
  <rect x="342" y="60" width="8" height="30" fill="#4C5B66" fill-opacity="0.4"/>

  <!-- Flèches vers les deux colonnes -->
  <line x1="255" y1="105" x2="165" y2="148" stroke="#262319" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <line x1="365" y1="105" x2="460" y2="148" stroke="#262319" stroke-width="1.5" marker-end="url(#arrowDark)"/>

  <!-- Colonne gauche : Mitose -->
  <text x="160" y="178" text-anchor="middle" font-weight="bold" fill="#7E3A1D">MITOSE (1 division)</text>

  <rect x="60" y="192" width="95" height="95" rx="8" fill="#C89B3C" fill-opacity="0.15" stroke="#7E3A1D" stroke-width="1.5"/>
  <text x="107" y="209" text-anchor="middle" font-size="10.5" fill="#524c3e">Cellule fille</text>
  <rect x="90" y="222" width="7" height="26" fill="#A6512B"/>
  <rect x="101" y="222" width="7" height="26" fill="#A6512B" fill-opacity="0.4"/>
  <rect x="118" y="222" width="7" height="26" fill="#4C5B66"/>
  <rect x="129" y="222" width="7" height="26" fill="#4C5B66" fill-opacity="0.4"/>
  <text x="107" y="272" text-anchor="middle" font-size="10" fill="#524c3e">2n = 4</text>

  <rect x="165" y="192" width="95" height="95" rx="8" fill="#C89B3C" fill-opacity="0.15" stroke="#7E3A1D" stroke-width="1.5"/>
  <text x="212" y="209" text-anchor="middle" font-size="10.5" fill="#524c3e">Cellule fille</text>
  <rect x="195" y="222" width="7" height="26" fill="#A6512B"/>
  <rect x="206" y="222" width="7" height="26" fill="#A6512B" fill-opacity="0.4"/>
  <rect x="223" y="222" width="7" height="26" fill="#4C5B66"/>
  <rect x="234" y="222" width="7" height="26" fill="#4C5B66" fill-opacity="0.4"/>
  <text x="212" y="272" text-anchor="middle" font-size="10" fill="#524c3e">2n = 4</text>

  <text x="160" y="322" text-anchor="middle" font-size="11" fill="#262319">Identiques entre elles</text>
  <text x="160" y="337" text-anchor="middle" font-size="11" fill="#262319">et à la cellule mère</text>

  <!-- Colonne droite : Méiose -->
  <text x="465" y="178" text-anchor="middle" font-weight="bold" fill="#4C5B66">MÉIOSE (2 divisions)</text>

  <rect x="365" y="192" width="68" height="68" rx="6" fill="#4C5B66" fill-opacity="0.12" stroke="#4C5B66" stroke-width="1.5"/>
  <rect x="388" y="209" width="6" height="20" fill="#A6512B"/>
  <rect x="400" y="209" width="6" height="20" fill="#4C5B66"/>

  <rect x="440" y="192" width="68" height="68" rx="6" fill="#4C5B66" fill-opacity="0.12" stroke="#4C5B66" stroke-width="1.5"/>
  <rect x="463" y="209" width="6" height="20" fill="#A6512B"/>
  <rect x="475" y="209" width="6" height="20" fill="#4C5B66" fill-opacity="0.4"/>

  <rect x="365" y="269" width="68" height="68" rx="6" fill="#4C5B66" fill-opacity="0.12" stroke="#4C5B66" stroke-width="1.5"/>
  <rect x="388" y="286" width="6" height="20" fill="#A6512B" fill-opacity="0.4"/>
  <rect x="400" y="286" width="6" height="20" fill="#4C5B66"/>

  <rect x="440" y="269" width="68" height="68" rx="6" fill="#4C5B66" fill-opacity="0.12" stroke="#4C5B66" stroke-width="1.5"/>
  <rect x="463" y="286" width="6" height="20" fill="#A6512B" fill-opacity="0.4"/>
  <rect x="475" y="286" width="6" height="20" fill="#4C5B66" fill-opacity="0.4"/>

  <text x="437" y="359" text-anchor="middle" font-size="11" fill="#262319">n = 2 chacune — 4 combinaisons différentes</text>
  <text x="437" y="374" text-anchor="middle" font-size="11" fill="#262319">(brassage indépendant des paires de chromosomes)</text>

  <!-- Légende couleurs -->
  <line x1="30" y1="398" x2="590" y2="398" stroke="#D8CDAF"/>
  <rect x="30" y="412" width="14" height="14" fill="#A6512B"/>
  <text x="50" y="423" fill="#262319">Chromosome de la paire A — exemplaire paternel</text>
  <rect x="30" y="431" width="14" height="14" fill="#A6512B" fill-opacity="0.4"/>
  <text x="50" y="442" fill="#262319">Chromosome de la paire A — exemplaire maternel</text>
  <rect x="30" y="450" width="14" height="14" fill="#4C5B66"/>
  <text x="50" y="461" fill="#262319">Chromosome de la paire B — exemplaire paternel</text>
  <rect x="30" y="469" width="14" height="14" fill="#4C5B66" fill-opacity="0.4"/>
  <text x="50" y="480" fill="#262319">Chromosome de la paire B — exemplaire maternel</text>

  <text x="310" y="504" text-anchor="middle" font-size="11" fill="#524c3e">La méiose réduit de moitié le nombre de chromosomes et brasse les combinaisons ;</text>
  <text x="310" y="519" text-anchor="middle" font-size="11" fill="#524c3e">la fécondation (n + n → 2n) restaure ensuite la diploïdie.</text>

  <defs>
    <marker id="arrowDark" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#262319"/>
    </marker>
  </defs>
</svg>

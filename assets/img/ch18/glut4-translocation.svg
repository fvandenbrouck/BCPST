<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="12.5">
  <rect width="480" height="300" fill="#FBF8F0"/>

  <text x="20" y="26" font-weight="bold" fill="#262319">Cellule musculaire au repos</text>
  <line x1="20" y1="45" x2="220" y2="45" stroke="#262319" stroke-width="3"/>
  <text x="225" y="49" fill="#262319" font-size="10">membrane</text>
  <circle cx="60" cy="90" r="14" fill="none" stroke="#4C5B66" stroke-width="2"/>
  <circle cx="110" cy="110" r="14" fill="none" stroke="#4C5B66" stroke-width="2"/>
  <circle cx="80" cy="140" r="14" fill="none" stroke="#4C5B66" stroke-width="2"/>
  <text x="20" y="180" fill="#4C5B66" font-size="11">Vésicules à GLUT4,</text>
  <text x="20" y="195" fill="#4C5B66" font-size="11">stockées dans le cytoplasme</text>

  <text x="260" y="26" font-weight="bold" fill="#262319">Après insuline / effort</text>
  <line x1="260" y1="45" x2="460" y2="45" stroke="#262319" stroke-width="3"/>
  <rect x="290" y="38" width="10" height="14" fill="#A6512B"/>
  <rect x="340" y="38" width="10" height="14" fill="#A6512B"/>
  <rect x="390" y="38" width="10" height="14" fill="#A6512B"/>
  <text x="266" y="70" fill="#7E3A1D" font-size="11">GLUT4 inséré dans la membrane</text>
  <line x1="295" y1="85" x2="295" y2="113" stroke="#5F6F42" stroke-width="2" marker-end="url(#arrowMoss)"/>
  <line x1="345" y1="85" x2="345" y2="113" stroke="#5F6F42" stroke-width="2" marker-end="url(#arrowMoss)"/>
  <text x="320" y="132" fill="#5F6F42" font-size="11" text-anchor="middle">glucose</text>

  <line x1="20" y1="240" x2="460" y2="240" stroke="#D8CDAF"/>
  <text x="240" y="262" text-anchor="middle" fill="#524c3e" font-size="12">L'insuline (ou la contraction musculaire elle-même) déclenche la translocation</text>
  <text x="240" y="280" text-anchor="middle" fill="#524c3e" font-size="12">des vésicules à GLUT4 vers la membrane, augmentant l'entrée de glucose.</text>

  <defs>
    <marker id="arrowMoss" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M0,8 L4,0 L8,8 Z" fill="#5F6F42"/>
    </marker>
  </defs>
</svg>
